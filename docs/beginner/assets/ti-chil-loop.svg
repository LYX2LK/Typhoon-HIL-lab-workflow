<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">TI C-HIL：把命令、驱动与反馈分开看</title><desc id="desc">本教程绘制的功能示意；通道、电平和供电选择按匹配版本的 TI 接口板资料核对。</desc>
