<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
<title id="title">单分流反馈：支路、比例与采样时刻一起对应</title><desc id="desc">功能关系示意；支路方向、注入位置、增益、偏置、延迟和采样窗口由本板方案确认。</desc>
