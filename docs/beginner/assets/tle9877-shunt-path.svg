<text x="540.0" y="140.5" text-anchor="middle" font-size="22">逆变器与电机模型</text>
<text x="540.0" y="170.5" text-anchor="middle" font-size="22">计算电路响应</text>
<rect x="800" y="105" width="270" height="85" rx="12" fill="#f2edf9" stroke="#6d558a" stroke-width="2"/>
<text x="935.0" y="140.5" text-anchor="middle" font-size="22">对应分流支路电流</text>
<text x="935.0" y="170.5" text-anchor="middle" font-size="22">i_shunt(t)</text>
<rect x="800" y="285" width="270" height="85" rx="12" fill="#f2edf9" stroke="#6d558a" stroke-width="2"/>
<text x="935.0" y="320.5" text-anchor="middle" font-size="22">分流关系与反馈调理</text>
