<rect width="100%" height="100%" fill="#fcfcf9"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#22383d">
<text x="34" y="40" font-size="25" font-weight="700">单分流反馈：支路、比例与采样时刻一起对应</text>
<rect x="30" y="105" width="250" height="85" rx="12" fill="#e8f2f0" stroke="#26675f" stroke-width="2"/>
<text x="155.0" y="140.5" text-anchor="middle" font-size="22">六路开关状态</text>
<text x="155.0" y="170.5" text-anchor="middle" font-size="22">调理后捕获</text>
