<path d="M800 327 H665" fill="none" stroke="#48606a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="732" y="308" text-anchor="middle" font-size="18" paint-order="stroke" stroke="#fcfcf9" stroke-width="7">电气反馈</text>
