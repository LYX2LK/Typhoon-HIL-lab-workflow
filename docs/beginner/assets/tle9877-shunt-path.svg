<rect x="30" y="285" width="250" height="85" rx="12" fill="#e8f2f0" stroke="#26675f" stroke-width="2"/>
<text x="155.0" y="320.5" text-anchor="middle" font-size="22">真实 ADC 与固件</text>
<text x="155.0" y="350.5" text-anchor="middle" font-size="22">在有效窗口内采样</text>
