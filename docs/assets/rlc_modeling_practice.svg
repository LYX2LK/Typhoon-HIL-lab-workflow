<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
<title id="title">自建 RLC 模型接线图</title>
<desc id="desc">Vs1 正端经 Rin 和串联电流测量 I 到节点 N；N 到 G 有电感 L 和电阻 R 串电容 C 两条支路。Vs1 负端和地接 G。Va1 正负端接 N、G，V_Rin 正负端接 Rin 前后 A、B。</desc>
<rect width="1040" height="620" fill="white"/>
<g font-family="Microsoft YaHei,Arial,sans-serif" fill="#18283b">
<text x="36" y="32" font-size="25" font-weight="600">自建 RLC 模型接线图</text>
<text x="36" y="58" font-size="17">先接主电路和 Va1，再加 V_Rin。圆点表示导线相连；A、B、N、M、G 为接线说明标记。</text>
</g>
<g fill="none" stroke="#263b50" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
<path d="M120 220 H190 M270 220 H394 M446 220 H920 M120 220 V324 M120 396 V500 H920 V388 M920 332 V220"/>
<rect x="190" y="208" width="80" height="24" fill="white"/>
<circle cx="420" cy="220" r="26" fill="white"/>
<circle cx="120" cy="360" r="36" fill="white"/>
<path d="M98 360 C105 336 113 336 120 360 S135 384 142 360"/>
<path d="M600 220 V270 C565 270 565 294 600 294 C565 294 565 318 600 318 C565 318 565 342 600 342 C565 342 565 366 600 366 V500"/>
<path d="M760 220 V286 M760 350 V430 M760 442 V500"/>
<rect x="748" y="286" width="24" height="64" fill="white"/>
<path d="M738 430 H782 M738 442 H782 M120 500 V535 M96 535 H144 M103 543 H137 M112 551 H128"/>
</g>
<g fill="none" stroke="#216bb0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
<path d="M120 220 V125 H206 M254 125 H340 V220"/>
<circle cx="230" cy="125" r="24" fill="white"/>
<circle cx="920" cy="360" r="28" fill="white"/>
</g>
<g fill="#263b50">
<circle cx="120" cy="220" r="4.5"/><circle cx="340" cy="220" r="4.5"/>
<circle cx="540" cy="220" r="4.5"/><circle cx="600" cy="220" r="4.5"/>
<circle cx="760" cy="220" r="4.5"/><circle cx="760" cy="390" r="4.5"/>
<circle cx="120" cy="500" r="4.5"/><circle cx="600" cy="500" r="4.5"/>
<circle cx="760" cy="500" r="4.5"/><circle cx="920" cy="500" r="4.5"/>
</g>
<g font-family="Microsoft YaHei,Arial,sans-serif" fill="#18283b" font-size="19">
<text x="92" y="255" font-weight="600">A</text><text x="332" y="255" font-weight="600">B</text>
<text x="529" y="199" font-weight="600">N</text><text x="782" y="397" font-weight="600">M</text>
<text x="148" y="526" font-weight="600">G：公共回线</text>
<text x="172" y="190">Rin = 5 Ω → 8 Ω</text>
<text x="416" y="227" font-weight="600">I</text>
<text x="386" y="200" font-size="16">+</text><text x="449" y="200" font-size="16">−</text>
<text x="622" y="330">L = 10 µH</text><text x="788" y="321">R = 0.1 Ω</text>
<text x="788" y="447">C = 500 µF</text>
<text x="57" y="312" font-weight="600">Vs1</text>
<text x="71" y="344">+</text><text x="71" y="390">−</text>
<text x="36" y="437" font-size="17">10 V RMS</text><text x="36" y="463" font-size="17">1000 Hz</text>
<text x="142" y="557" font-size="17">gnd</text>
</g>
<g font-family="Microsoft YaHei,Arial,sans-serif" fill="#216bb0" font-size="19">
<text x="184" y="88" font-weight="600">V_Rin</text><text x="223" y="132">V</text>
<text x="186" y="116">+</text><text x="266" y="116">−</text>
<text x="949" y="364" font-weight="600">Va1</text><text x="913" y="367">V</text>
<text x="934" y="319">+</text><text x="934" y="410">−</text>
</g>
<g font-family="Microsoft YaHei,Arial,sans-serif" font-size="17">
<text x="36" y="593" fill="#263b50">黑色：主电路与串联电流测量</text>
<text x="345" y="593" fill="#216bb0">蓝色：并联电压测量</text>
<text x="598" y="593" fill="#18283b">Va1 = V(N) − V(G)；V_Rin = V(A) − V(B)</text>
</g>
</svg>
